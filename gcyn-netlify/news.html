  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" aria-label="Previous photo">&#8249;</button>
    <img alt="">
    <button class="lb-nav lb-next" aria-label="Next photo">&#8250;</button>
  </div>
  <footer>© 2026 Global Cambodia Youth Network</footer>
  <script>
  (function(){
    var shots=[].slice.call(document.querySelectorAll('.gallery .shot')),lb=document.getElementById('lightbox'),img=lb.querySelector('img'),i=0;
    function show(n){i=(n+shots.length)%shots.length;var a=shots[i];img.src=a.getAttribute('href');img.alt=a.querySelector('img').alt;lb.hidden=false;document.body.style.overflow='hidden';}
    function hide(){lb.hidden=true;img.src='';document.body.style.overflow='';}
    shots.forEach(function(a,n){a.addEventListener('click',function(e){e.preventDefault();show(n);});});
    lb.querySelector('.lb-close').onclick=hide;
    lb.querySelector('.lb-prev').onclick=function(e){e.stopPropagation();show(i-1);};
    lb.querySelector('.lb-next').onclick=function(e){e.stopPropagation();show(i+1);};
    lb.addEventListener('click',function(e){if(e.target===lb)hide();});
    document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')hide();if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);});
  })();
  </script>
